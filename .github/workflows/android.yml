name: Gomobile for Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build library for Android with gomobile
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 1.8
      uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
      with:
        java-version: 1.8

    - name: Set up Go 1.x
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: ^1.16
      id: go

    - name: Install NDK
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
      with:
        ndk-version: r23c
        link-to-sdk: true

    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Build
      run: |
        for d in $ANDROID_NDK_HOME/../23*; do
          ANDROID_NDK_HOME=$d
        done
        ./build.sh android
        find dist

    - name: Upload Android artifacts
      uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
      with:
        name: Android build
        path: dist/android
        if-no-files-found: error
